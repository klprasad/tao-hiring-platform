<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="dialog__message">{{ data.message }}</p>

  <ng-content />
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (type === 'confirm') {
    <tao-button label="Cancel" appearance="outlined" (click)="cancel()" />
  }

  <tao-button [label]="type === 'alert' ? 'OK' : 'Confirm'" (click)="confirm()" />
</mat-dialog-actions>
