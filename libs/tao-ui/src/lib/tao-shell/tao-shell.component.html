<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">T</span><span>TAO</span></div>
    <p class="eyebrow">{{ product() }}</p>
    <nav aria-label="Primary navigation">
      @for (item of items(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span
            class="nav-icon"
            [class]="'nav-icon nav-icon-' + item.icon"
            aria-hidden="true"
          ></span
          ><span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      <span class="avatar">AM</span
      ><span><strong>Alex Morgan</strong><small>Talent Operations</small></span>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <span class="context">{{ context() }}</span>
      <div class="top-actions">
        <button type="button" aria-label="Help">?</button
        ><button type="button" aria-label="Notifications">&#9676;</button
        ><span class="user-initials">AM</span>
      </div>
    </header>
    <section class="content"><ng-content /></section>
  </main>
</div>
