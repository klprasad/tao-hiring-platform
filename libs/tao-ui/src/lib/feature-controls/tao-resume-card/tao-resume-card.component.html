<article class="resume">
  <header>
    <span class="file">CV</span>
    <div>
      <strong>{{ candidate() }}</strong
      ><small>{{ role() }}</small>
    </div>
    <tao-button appearance="icon" label="Open resume" tooltip="Open resume">↗</tao-button>
  </header>
  <p>{{ summary() }}</p>
</article>
