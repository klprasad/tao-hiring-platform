<div class="page">
  <tao-page-header
    title="Hiring strategy"
    description="Generate and approve the recruitment strategy for this campaign."
  >
    @if (!strategy()) {
      <tao-button
        label="Generate strategy"
        appearance="filled"
        [disabled]="isLoading() || !campaignId"
        (click)="generate()"
      />
    }
  </tao-page-header>

  @if (errorMessage()) {
    <p class="error" role="alert">{{ errorMessage() }}</p>
  }

  @if (isLoading()) {
    <div class="loading" role="status">Working...</div>
  }

  @if (strategy(); as currentStrategy) {
    <tao-hiring-strategy-edit [profile]="currentStrategy" />
  }
</div>
