<form class="campaign-form" [formGroup]="campaignForm" (ngSubmit)="submit()">
  <!-- Basic Information -->

  <tao-card class="form-card">
    <div class="card-header">
      <div>
        <h2>Campaign Information</h2>
        <p>Define the basic information for this hiring campaign.</p>
      </div>
    </div>

    <div class="form-grid">
      <tao-input
        class="span-2"
        label="Campaign Name"
        placeholder="e.g. Senior .NET Hiring"
        formControlName="campaignName"
        [showErrors]="showValidationErrors()"
        [required]="true"
      >
      </tao-input>

      <tao-input
        label="Reference Number"
        placeholder="dev1"
        formControlName="referenceNumber"
        [showErrors]="showValidationErrors()"
        [required]="true"
      >
      </tao-input>

      <tao-input
        label="Hiring Manager ID"
        placeholder="e.g. 019FA8F7-E53A-76F6-A7E1-5F7096B2CCDF"
        formControlName="hiringManagerId"
        [showErrors]="showValidationErrors()"
        [required]="true"
      >
      </tao-input>
      <tao-input
        label="Recruiter ID"
        placeholder="e.g. 019FA8F7-E53A-76F6-A7E1-5F7096B2CCDF"
        formControlName="recruiterId"
        [showErrors]="showValidationErrors()"
        [required]="true"
      >
      </tao-input>
      <tao-input
        label="Number of Openings"
        placeholder="e.g. 2"
        formControlName="openings"
        [showErrors]="showValidationErrors()"
        [required]="true"
      >
      </tao-input>
    </div>
  </tao-card>

  <!-- Actions -->

  <div class="form-actions">
    <tao-button type="button" label="Cancel" appearance="outlined" (click)="cancel()"> </tao-button>

    <tao-button type="submit" label="Create Campaign" appearance="filled"> </tao-button>
  </div>
</form>
