<form class="campaign-form" [formGroup]="campaignForm" (ngSubmit)="submit()">
  <tao-card class="form-card">
    <div class="card-header">
      <h2>Campaign Information</h2>

      <p>Define the basic information for this hiring campaign.</p>
    </div>

    <div class="form-grid">
      <tao-input
        label="Campaign Name"
        placeholder="e.g. Senior .NET Hiring"
        formControlName="campaignName"
        [showErrors]="showValidationErrors()"
        [required]="true"
      />

      <tao-input
        label="Reference Number"
        placeholder="e.g. DEV-001"
        formControlName="referenceNumber"
        [showErrors]="showValidationErrors()"
        [required]="true"
      />

      <tao-input
        label="Hiring Manager ID"
        placeholder="e.g. 019FA8F7-E53A-76F6-A7E1-5F7096B2CCDF"
        formControlName="hiringManagerId"
        [showErrors]="showValidationErrors()"
        [required]="true"
      />

      <tao-input
        label="Recruiter ID"
        placeholder="e.g. 019FA8F7-E53A-76F6-A7E1-5F7096B2CCDF"
        formControlName="recruiterId"
        [showErrors]="showValidationErrors()"
        [required]="true"
      />

      <tao-input
        label="Number of Openings"
        type="number"
        placeholder="e.g. 2"
        formControlName="openings"
        [showErrors]="showValidationErrors()"
        [required]="true"
      />
    </div>
  </tao-card>

  <div class="form-actions">
    <tao-button type="button" label="Cancel" appearance="outlined" (click)="cancel()" />

    <tao-button type="submit" label="Create Campaign" appearance="filled" color="primary" />
  </div>
</form>
