<section class="campaign-workspace">
  <header class="campaign-workspace__hero">
    <div class="campaign-workspace__copy">
      <span class="workspace-kicker">RECRUITER WORKSPACE</span>
      <h1>Hiring campaigns</h1>
      <p>Track progress and manage the roles your team is hiring for.</p>
    </div>

    <div class="campaign-workspace__actions">
      <label class="search-control">
        <mat-icon aria-hidden="true">search</mat-icon>
        <span class="visually-hidden">Search campaigns</span>
        <input
          type="search"
          placeholder="Search campaigns..."
          [value]="searchTerm()"
          (input)="onSearchInput($event)"
        />
      </label>

      <tao-button
        label="Create Campaign"
        icon="add"
        appearance="filled"
        color="primary"
        size="small"
        (click)="createCampaign()"
      />
    </div>
  </header>

  <section class="campaign-list-card" aria-label="Campaign list">
    <div class="campaign-list-card__heading">
      <div>
        <span class="workspace-kicker">ALL ROLES</span>
        <h2>Campaign directory</h2>
      </div>
      <span class="campaign-list-card__count">{{ filteredCampaigns().length }} shown</span>
    </div>
    @if (filteredCampaigns().length > 0) {
      <tao-data-table
        [columns]="columns"
        [rows]="filteredCampaigns()"
        [config]="tableConfig"
        (rowClick)="onRowClick($event)"
      />
    }

    @if (filteredCampaigns().length === 0) {
      <tao-empty-state
        icon="search_off"
        title="No campaigns found"
        message="Try changing your search or create a new campaign."
      />
    }
  </section>
</section>
