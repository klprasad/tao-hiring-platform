<div class="page">
  <header class="campaign-header">
    <div class="campaign-heading">
      <div class="campaign-mark" aria-hidden="true">
        <mat-icon>workspaces</mat-icon>
      </div>
      <div>
        <h1>Hiring Campaigns</h1>
        <p>Track progress and manage your open roles.</p>
      </div>
    </div>

    <div class="campaign-actions">
      <label class="search-control">
        <mat-icon aria-hidden="true">search</mat-icon>
        <span class="visually-hidden">Search campaigns</span>
        <input
          type="search"
          placeholder="Search campaigns..."
          [value]="searchTerm()"
          (input)="onSearchInput($event)"
        />
      </label>

      <tao-select
        class="status-filter"
        label="Status"
        placeholder="All statuses"
        [options]="statusOptions"
        [ngModel]="selectedStatus()"
        (ngModelChange)="selectedStatus.set($event)"
      >
      </tao-select>

      <tao-button label="Create Campaign" icon="add" (click)="createCampaign()"> </tao-button>
    </div>
  </header>

  <tao-card class="campaign-list-card">
    <!-- Campaign Table -->
    @if (filteredCampaigns().length > 0) {
      <tao-data-table
        [columns]="columns"
        [rows]="filteredCampaigns()"
        [config]="tableConfig"
        (rowClick)="onRowClick($event)"
      />
    }

    <!-- Empty State -->
    @if (filteredCampaigns().length === 0) {
      <tao-empty-state
        icon="search_off"
        title="No campaigns found"
        message="Try changing your search or create a new campaign."
      >
        <tao-button label="Create Campaign" (click)="createCampaign()"> </tao-button>
      </tao-empty-state>
    }
  </tao-card>
</div>
