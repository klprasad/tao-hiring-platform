<tao-page-header title="Campaigns" description="Create, monitor, and manage your hiring campaigns.">
  <tao-button label="Create campaign" />
</tao-page-header>
<tao-card title="All campaigns">
  <div class="toolbar">
    <tao-input label="Search campaigns" placeholder="Search campaigns" />
    <tao-select label="Status" [options]="statuses" />
  </div>
  <tao-table [columns]="campaignColumns" [rows]="campaignRows" />
</tao-card>
