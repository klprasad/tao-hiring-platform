<form class="job-profile-form" [formGroup]="form" (ngSubmit)="submit()">
  <tao-card class="form-card">
    <div class="card-header">
      <h2>Job profile</h2>
      <p>Give the hiring team a clear, complete Job Description.</p>
    </div>

    <div class="form-stack">
      <tao-textarea
        label="Description"
        placeholder="Provide the complete job description."
        formControlName="description"
        [rows]="6"
        [showErrors]="showValidationErrors()"
        [required]="true"
      />
    </div>
  </tao-card>

  <div class="form-actions">
    <tao-button type="button" label="Cancel" appearance="outlined" (click)="cancel()" />
    <tao-button type="submit" label="Save job profile" appearance="filled" />
  </div>
</form>
