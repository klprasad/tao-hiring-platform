<section class="job-profile-form-workspace">
  <header class="job-profile-form-workspace__hero">
    <div>
      <span class="workspace-kicker">CAMPAIGN WORKFLOW / ROLE DEFINITION</span>
      <h1>Review job profile</h1>
      <p>Refine the generated role profile before approving it for the hiring workflow.</p>
    </div>
  </header>
  @if (errorMessage()) {
    <p class="job-profile-form-workspace__error" role="alert">{{ errorMessage() }}</p>
  }
  <main class="job-profile-form-workspace__content">
    <tao-job-profile-form
      [profile]="profile()"
      [disabled]="profile().status !== status.Generated"
      (resubmitted)="regenerateProfile($event)"
      (cancelled)="cancel()"
    />
  </main>
</section>
