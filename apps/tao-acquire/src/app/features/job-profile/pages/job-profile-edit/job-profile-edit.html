<div class="page">
  <tao-page-header
    title="Job profile"
    description="Review the AI-generated job profile and approve it for the hiring workflow."
  >
  </tao-page-header>
  <div class="content">
    <div class="profile-content">
      <tao-job-profile-form
        [profile]="profile()"
        [disabled]="profile().status !== status.Generated"
        (resubmitted)="regenerateProfile($event)"
        (cancelled)="cancel()"
      />
    </div>
  </div>
</div>
