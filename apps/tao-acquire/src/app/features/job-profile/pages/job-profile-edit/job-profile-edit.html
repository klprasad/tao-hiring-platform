<div class="page">
  <tao-page-header title="Edit job profile" subtitle="Keep the role requirements current and useful.">
    <tao-button appearance="icon" icon="arrow_back" label="Back to job profiles" tooltip="Back to job profiles" (click)="cancel()" />
  </tao-page-header>
  @if (errorMessage()) { <p class="error" role="alert">{{ errorMessage() }}</p> }
  @if (isLoading()) { <div class="loading" role="status">Loading job profile...</div> }
  @else if (profile(); as currentProfile) {
    <div class="content"><tao-job-profile-form [profile]="currentProfile" (submitted)="updateProfile($event)" (cancelled)="cancel()" /></div>
  }
</div>
