<section class="job-profile-form-workspace">
  <header class="job-profile-form-workspace__hero">
    <div>
      <span class="workspace-kicker">CAMPAIGN WORKFLOW / ROLE DEFINITION</span>
      <h1>Create job profile</h1>
      <p>Define the role requirements for your hiring team.</p>
    </div>
    <tao-button
      appearance="icon"
      icon="arrow_back"
      label="Back to job profiles"
      tooltip="Back to job profiles"
      (click)="cancel()"
    />
  </header>
  <main class="job-profile-form-workspace__content">
    <tao-job-profile-form (submitted)="createProfile($event)" (cancelled)="cancel()" />
  </main>
</section>
