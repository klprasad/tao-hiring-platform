<div class="candidate-shell">
  <header class="candidate-shell__header">
    <div class="candidate-shell__brand">
      <span class="candidate-shell__status"></span>

      <span class="candidate-shell__logo"> TAO </span>

      <span class="candidate-shell__divider"></span>

      <span class="candidate-shell__title"> Technical Assessment </span>
    </div>
    <tao-theme-switcher />
  </header>

  <main class="candidate-shell__content">
    <tao-loading-state [loading]="loading()"></tao-loading-state>
    <router-outlet></router-outlet>
  </main>

  @if (focusWarningVisible()) {
    <div class="focus-warning__backdrop">
      <section
        class="focus-warning"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="focus-warning-title"
        aria-describedby="focus-warning-description"
      >
        <h2 id="focus-warning-title">Stay in your assessment</h2>
        <p id="focus-warning-description">
          This assessment tab became hidden or lost focus. Please keep this window active while you
          complete your assessment.
        </p>
        <button type="button" autofocus (click)="dismissFocusWarning()">
          Return to assessment
        </button>
      </section>
    </div>
  }
</div>
