<section class="page page--narrow">
  <p class="eyebrow">Step 2 of 4</p>

  <h1>Before you begin</h1>

  <p>Please review and acknowledge the assessment conditions before continuing.</p>

  <div class="card consent-card">
    @for (consent of consents(); track consent.id) {
      <label class="consent-item">
        <input
          type="checkbox"
          [ngModel]="consent.accepted"
          (ngModelChange)="updateConsent(consent.id, $event)"
        />

        <span>{{ consent.text }}</span>
      </label>
    }
  </div>

  <div class="actions">
    <button class="secondary" type="button" (click)="back()">Back</button>

    <button class="primary" type="button" [disabled]="!allAccepted()" (click)="continue()">
      Accept &amp; Continue
    </button>
  </div>
</section>
