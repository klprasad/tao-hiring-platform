<div class="auth-page">
  <div class="auth-page__content">
    <div class="auth-page__eyebrow">CANDIDATE AUTHENTICATION</div>

    <h1 class="auth-page__title">Welcome</h1>

    <p class="auth-page__description">Please confirm your email to continue.</p>

    <form class="auth-card" [formGroup]="form" (ngSubmit)="continue()">
      <div class="auth-card__field">
        <label class="auth-card__label" for="email"> Email </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="auth-card__input"
        />

        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="auth-card__error"> Please enter a valid email address. </span>
        }
      </div>

      <button type="submit" class="auth-card__button" [disabled]="form.invalid">Continue</button>
    </form>

    <p class="auth-page__security">Your assessment is secure.</p>
  </div>
</div>
