<div class="auth-page">
  <div class="auth-page__content">
    <div class="auth-page__eyebrow">CANDIDATE AUTHENTICATION</div>

    <h1 class="auth-page__title">Welcome</h1>

    <p class="auth-page__description">Please login to continue.</p>

    <tao-acquire-login
      description="Sign in with your account to start assessment."
      [submitting]="submitting()"
      [errorMessage]="errorMessage()"
      (login)="onLogin($event)"
    />

    <p class="auth-page__security">Your assessment is secure.</p>
  </div>
</div>
