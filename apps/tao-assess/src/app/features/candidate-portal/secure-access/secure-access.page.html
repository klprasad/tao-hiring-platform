<section class="access">
  <div class="brand">TAO</div>
  <div class="card">
    <p class="eyebrow">Technical Assessment</p>
    <h1>Secure access</h1>
    <p>Enter the email address associated with your assessment invitation.</p>
    <label>Email<input type="email" [(ngModel)]="email" placeholder="you@example.com" /></label>
    <tao-button
      class="full-width"
      type="button"
      appearance="filled"
      color="primary"
      label="Continue"
      [fullWidth]="true"
      [disabled]="!email"
      (click)="continue()"
    />
    <span class="secure">Your assessment is secure</span>
  </div>
</section>
