<section class="page page--narrow">
  <p class="eyebrow">Final review</p>
  <h1>You're ready to submit</h1>
  <p>Review the completion summary. Submission is a one-time action.</p>
  <div class="card summary">
    <div>
      <span>Rounds completed</span><strong>{{ store.rounds()?.length }}</strong>
    </div>
    <div>
      <span>Total assessment time</span
      ><strong>{{ store.landing()?.durationMinutes }} minutes</strong>
    </div>
    <div><span>Responses</span><strong>Saved</strong></div>
  </div>
  <div class="actions">
    <tao-button
      label="Submit Final Assessment"
      appearance="filled"
      color="primary"
      (click)="submit()"
    ></tao-button>
  </div>
</section>
